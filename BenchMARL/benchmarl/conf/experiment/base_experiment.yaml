defaults:
  - experiment_config
  - _self_

# The device for collection (e.g. cuda)
sampling_device: "cpu"
# The device for training (e.g. cuda)
train_device: "cpu"
# The device for the replay buffer of off-policy algorithms (e.g. cuda).
# Use "disk" to store it on disk (in the experiment save_folder)
buffer_device: "cpu"

# Whether to share the parameters of the policy within agent groups
share_policy_params: True
# If an algorithm and an env support both continuous and discrete actions, what should be preferred
prefer_continuous_actions: True
# If False collection is done using a collector (under no grad). If True, collection is done with gradients.
collect_with_grad: False
# In case of non-vectorized environments, whether to run collection of multiple processes
# If this is used, there will be n_envs_per_worker processes, collecting frames_per_batch/n_envs_per_worker frames each
parallel_collection: False

# Discount factor
gamma: 0.9
# Learning rate
lr: 0.00005
# The epsilon parameter of the adam optimizer
adam_eps: 0.000001
# Clips grad norm if true and clips grad value if false
clip_grad_norm: True
# The value for the clipping, if null no clipping
clip_grad_val: 5

# Whether to use soft or hard target updates
soft_target_update: True
# If soft_target_update is True, this is its polyak_tau
polyak_tau: 0.005
# If soft_target_update is False, this is the frequency of the hard target updates in terms of n_optimizer_steps
hard_target_update_frequency: 5

# ---------------------------------------------------------------------------
# Reward perturbation (kernel K, applied independently to every agent's reward)
# ---------------------------------------------------------------------------
# Whether to perturb the training rewards (evaluation always uses true rewards)
reward_perturbation: False
# The perturbation kernel: "normal" (additive zero-mean Gaussian) or "bernoulli" (outliers)
reward_perturbation_type: "normal"
# Standard deviation of the "normal" kernel
reward_perturbation_stdev: 0.5
# Probability that a reward is replaced by an outlier ("bernoulli" kernel)
reward_perturbation_flip_prob: 0.2
# Outliers are +/- this value ("bernoulli" kernel)
reward_perturbation_outlier_value: 10.0

# ---------------------------------------------------------------------------
# Grouped-reward robustness (GR^2-MARL), see benchmarl/reward_robustness
# ---------------------------------------------------------------------------
# How agents are grouped for the consensus correction:
#   none              no correction (No-Correction baseline)
#   oracle            levels of the true reward (upper bound)
#   global            all agents in a single group (ablation)
#   warmup            classifier trained on oracle labels during a clean warm-up, then frozen
#   gmm               classifier trained online on GMM clusters of the noisy rewards (paper No-Warmup)
#   reward_model      warm-up free: regress noisy rewards on (o, a[, o']) and group agents with
#                     similar predicted rewards (see reward_model_* below)
#   reward_model_only baseline: replace rewards with the learned reward model
#   certified         reward-model proposals used only once certified from the noisy data (see certify_*)
grouping_method: "none"
# Consensus function C: "mean", "median", "trimmed_mean" or "auto" (mean for "normal", median otherwise)
consensus: "auto"
# Fraction trimmed from each side by "trimmed_mean"
consensus_trim: 0.2
# Number of groups K (oracle levels, classifier outputs, k-means clusters)
num_groups: 3
# Log grouping quality and reward-error diagnostics (uses the true rewards, for analysis only)
evaluate_grouping: False
# Number of warm-up iterations on clean rewards (grouping_method=warmup, or certified with certify_warmup)
warmup_iters: 50
# Training of the grouping network, per iteration (per warm-up iteration for "warmup")
grouping_epochs: 35
grouping_lr: 0.001
grouping_batch_size: 512
# Also feed the next observation o' to the grouping network (rewards are R(s, a, s'))
grouping_use_next_obs: False
# Append a one-hot agent index to the grouping-network input (role-dependent rewards)
grouping_use_agent_id: False
# Compute the groups of an iteration with the parameters fitted on previous iterations only, so the
# grouping does not depend on the current noise realisation. False reproduces the original No-Warmup.
grouping_out_of_sample: True
# Order GMM components by their mean so that labels are consistent across batches ("gmm").
# False reproduces the original No-Warmup implementation.
grouping_gmm_sort: True
# Similarity tolerance epsilon (reward units) for reward_model_assign = "epsilon" / "kernel"
grouping_epsilon: 0.5
# Reward-model loss: "mse", "huber", "l1" or "auto" (mse for "normal", l1 otherwise)
reward_model_loss: "auto"
# How agents are grouped from predicted rewards: "kmeans" (num_groups clusters), "epsilon"
# (per-timestep epsilon-gap clustering), "kernel" (soft weights with bandwidth epsilon) or "global"
reward_model_assign: "kmeans"
# Residual consensus: apply the consensus to r~ - f(o, a) and add f(o, a) back
reward_model_residual: False
# Number of bootstrapped heads of the reward model. With > 1 heads, agents whose predictive std
# exceeds grouping_epsilon are not grouped (they keep their own reward), so an unsure model falls
# back to no correction instead of merging agents with different rewards
reward_model_heads: 1
# Only correct rewards once the reward model beats a constant predictor out of sample (paired
# z-test on the previous batch). Prevents an untrained model from degenerating into global
# grouping, which erases the credit of rare reward events. 0 disables the gate
reward_model_min_skill_z: 3.0
# --- grouping_method=certified (certified consensus) ---
# Reward-model proposals (merge agents with grouping_epsilon-close predicted rewards, optionally only
# within persistent identity clusters) are used only once out-of-sample statistics certify that the
# merged agents' mean squared reward difference is <= grouping_epsilon^2 (upper confidence bound).
# Recommended: grouping_use_next_obs=True grouping_epochs=1.
# Confidence of the certification, in standard errors (one-sided)
certify_z: 1.0
# Memory of the certification statistics (per-iteration decay)
certify_decay: 0.5
# Known noise std of the reward perturbation, or null to estimate it (certify_noise_estimator).
# To use the configured perturbation: experiment.certify_noise_std='${experiment.reward_perturbation_stdev}'
certify_noise_std: null
# How to estimate the noise when certify_noise_std is null:
#   replicates  common variance (same for all agents) from replicated transitions: identical (o, a, o')
#               (pure error) or nearest neighbours extrapolated to distance 0; assumes the true reward is a
#               deterministic function of the local transition. Allows temporal merging.
#   temporal    per agent from temporal differences of reward-model residuals (+ skill gate, lag-1 identity)
certify_noise_estimator: "replicates"
# Replicate key: "transition" (o, a, o') or "next_obs" (o' only: assumes the reward is a function of o',
# a stronger assumption that gives more replicates, hence a precise noise estimate sooner)
certify_replicate_key: "transition"
# Average the noisy rewards of all samples in a batch with identical replicate keys (any agent, any step)
# before the certified merges. Zero bias if the reward is deterministic in the key, so it applies from the
# first iteration. Helps in discrete-observation tasks (e.g. co-located Pursuit agents); no-op otherwise.
certify_replicate_consensus: False
# Also certify residual rules: consensus on r~ - f (reward-model prediction f added back), so merged agents need
# equal model errors, not equal rewards. Once the model is good, whole steps can be merged (incl. rare events),
# and temporal merging works through predicted spikes. Plain and residual rules compete; the largest certified wins.
certify_residual: False
# With certify_noise_estimator=temporal, also require the reward model to beat a constant out of sample
# (reward_model_min_skill_z); guards against not-yet-learned single-step reward events
certify_skill_gate: True
# Inverse-variance weighted group means (weights 1/s_j^2): best unbiased group estimate when agents'
# noise levels differ (uses the per-agent estimates in noise-variance-free mode)
certify_ivw: False
# Also average each agent's corrected reward over its own neighbouring steps (odd window, e.g. 5;
# 0 = off), only where predicted rewards are epsilon-close and the temporal rule is certified.
# Requires a known noise std or certify_noise_estimator=replicates; 9 worked best offline (5 < 9 <~ 13).
# Large gains for persistent rewards
certify_temporal_window: 0
# Fit the proposal reward model on clean rewards during a short warm-up (warmup_iters iterations, e.g. 2)
certify_warmup: False

# When an exploration wrapper is used. This is its initial epsilon for annealing
exploration_eps_init: 0.8
# When an exploration wrapper is used. This is its final epsilon after annealing
exploration_eps_end: 0.01
# Number of frames for annealing of exploration strategy in deterministic policy algorithms
# If null it will default to max_n_frames / 3
exploration_anneal_frames: null

# The maximum number of experiment iterations before the experiment terminates, exclusive with max_n_frames
max_n_iters: null
# Number of collected frames before ending, exclusive with max_n_iters
max_n_frames: 1_500_000

# Number of frames collected and each experiment iteration
on_policy_collected_frames_per_batch: 3000
# Number of environments used for collection
# If the environment is vectorized, this will be the number of batched environments.
# Otherwise batching will be simulated and each env will be run sequentially or parallelly depending on parallel_collection.
on_policy_n_envs_per_worker: 10
# This is the number of times collected_frames_per_batch will be split into minibatches and trained
on_policy_n_minibatch_iters: 45
# In on-policy algorithms the train_batch_size will be equal to the on_policy_collected_frames_per_batch
# and it will be split into minibatches with this number of frames for training
on_policy_minibatch_size: 50

# Number of frames collected and each experiment iteration
off_policy_collected_frames_per_batch: 3000
# Number of environments used for collection
# If the environment is vectorized, this will be the number of batched environments.
# Otherwise batching will be simulated and each env will be run sequentially or parallelly depending on parallel_collection.
off_policy_n_envs_per_worker: 10
# This is the number of times off_policy_train_batch_size will be sampled from the buffer and trained over.
off_policy_n_optimizer_steps: 1000
# Number of frames used for each off_policy_n_optimizer_steps when training off-policy algorithms
off_policy_train_batch_size: 128
# Maximum number of frames to keep in replay buffer memory for off-policy algorithms
off_policy_memory_size: 1_000_000
# Number of random action frames to prefill the replay buffer with
off_policy_init_random_frames: 0
# whether to use priorities while sampling from the replay buffer
off_policy_use_prioritized_replay_buffer: False
# exponent that determines how much prioritization is used when off_policy_use_prioritized_replay_buffer = True
# PRB reduces to random sampling when alpha=0
off_policy_prb_alpha: 0.6
# importance sampling negative exponent when off_policy_use_prioritized_replay_buffer = True
off_policy_prb_beta: 0.4


evaluation: True
# Whether to render the evaluation (if rendering is available)
render: True
# Frequency of evaluation in terms of collected frames (this should be a multiple of on/off_policy_collected_frames_per_batch)
evaluation_interval: 120_000
# Number of episodes that evaluation is run on
evaluation_episodes: 10
# If True, when stochastic policies are evaluated, their deterministic value is taken, otherwise, if False, they are sampled
evaluation_deterministic_actions: False
# If True, seed the environment before evaluation leading to always the same evaluation env being used
# If False, evaluation environments will be more random throughout training
evaluation_static: False

# List of loggers to use, options are: wandb, csv, tensorboard, mflow
loggers: [csv,wandb]
# Wandb project name
project_name: "benchmarl"
# Create a json folder as part of the output in the format of marl-eval
create_json: True
# Custom name for the experiment, if set, this will override the hydra job name
set_custom_name: False
custom_name: null

# Absolute path to the folder where the experiment will log.
# If null, this will default to the hydra output dir (if using hydra) or to the current folder when the script is run (if not).
# If you are reloading an experiment with "restore_file", this will default to the reloaded experiment folder.
save_folder: null
# Absolute path to a checkpoint file where the experiment was saved. If null the experiment is started fresh.
restore_file: null
# Map location given to `torch.load()` when reloading.
# If you are reloading in a cpu-only machine a gpu experiment, you can use `restore_map_location: {"cuda:0":"cpu"}`
# to map gpu tensors to the cpu
restore_map_location: null
# Interval for experiment saving in terms of collected frames (this should be a multiple of on/off_policy_collected_frames_per_batch).
# Set it to 0 to disable checkpointing
checkpoint_interval: 0
# Whether to checkpoint when the experiment is done
checkpoint_at_end: False
# How many checkpoints to keep. As new checkpoints are taken, temporally older checkpoints are deleted to keep this number of
# checkpoints. The checkpoint at the end is included in this number. Set to `null` to keep all checkpoints.
keep_checkpoints_num: 3
